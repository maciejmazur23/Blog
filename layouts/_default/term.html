{{ define "main" }}
  {{ partial "category-header.html" . }}
  {{- $paginator := .Paginate .Pages -}}
  <div class="ndm-list">
    <div class="ndm-grid">
      {{ range $paginator.Pages }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
    {{ partial "ndm-pager.html" $paginator }}
  </div>
{{ end }}
